version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:14-alpine
    container_name: agrimarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agrimarket
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: agrimarket_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrimarket -d agrimarket_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agrimarket-network

  # ============================================
  # Adminer (Database Management UI)
  # ============================================
  adminer:
    image: adminer:latest
    container_name: agrimarket-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      - postgres
    networks:
      - agrimarket-network

  # ============================================
  # Backend API (Optional - for full Docker setup)
  # ============================================
  # Uncomment to run backend in Docker
  # api:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: agrimarket-api
  #   restart: unless-stopped
  #   ports:
  #     - "3001:3001"
  #   environment:
  #     NODE_ENV: development
  #     DATABASE_URL: postgresql://agrimarket:dev_password@postgres:5432/agrimarket_dev?schema=public
  #     JWT_ACCESS_SECRET: dev-jwt-access-secret-change-in-production
  #     JWT_REFRESH_SECRET: dev-jwt-refresh-secret-change-in-production
  #     PORT: 3001
  #     FRONTEND_URL: http://localhost:3000
  #   volumes:
  #     - ./backend:/app
  #     - /app/node_modules
  #     - backend_uploads:/app/uploads
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - agrimarket-network
  #   command: npm run dev

  # ============================================
  # Frontend (Optional - for full Docker setup)
  # ============================================
  # Uncomment to run frontend in Docker
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: agrimarket-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     VITE_API_URL: http://localhost:3001/api
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   depends_on:
  #     - api
  #   networks:
  #     - agrimarket-network
  #   command: npm run dev

  # ============================================
  # Redis (Optional - for caching)
  # ============================================
  # redis:
  #   image: redis:7-alpine
  #   container_name: agrimarket-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5
  #   networks:
  #     - agrimarket-network

volumes:
  postgres_data:
    driver: local
  # backend_uploads:
  #   driver: local
  # redis_data:
  #   driver: local

networks:
  agrimarket-network:
    driver: bridge
